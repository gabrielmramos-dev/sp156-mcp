name: ci

on:
  push:
    branches: [main]
  pull_request:

# Menor privilégio possível para o GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # TODO: fixar cada action por SHA completo do commit (o Dependabot
      # mantém atualizado). As tags abaixo são as últimas conferidas em 2026-10-23.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
